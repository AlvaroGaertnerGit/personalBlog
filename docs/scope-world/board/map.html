<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pliego · mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The map is the world itself, seen from high above (orthographic render). Labels and
     the route are placed from points projected through the render camera (map.points.json). */
  :root { --ink: #1c1b21; --paper: #ede6d8; --amber: #f2b65a; --margin: #9a3b2a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1200px; overflow: hidden; background: #0b1220; font-family: Geist, system-ui, sans-serif; }
  .world { position: absolute; inset: 0; background: url(../renders/map.jpg) center / cover no-repeat; }
  svg { position: absolute; inset: 0; }
  .label { position: absolute; transform: translate(-50%, -100%); padding-bottom: 14px; text-align: left; }
  .card { background: rgba(237,230,216,.94); color: var(--ink); border-radius: 10px; padding: 10px 14px 11px; box-shadow: 0 10px 30px rgba(0,0,0,.25); min-width: 210px; }
  .card b { display: flex; gap: 8px; align-items: baseline; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .card b em { font: 500 12px "Geist Mono", monospace; font-style: normal; color: var(--margin); }
  .card span { display: block; font: 400 12px/1.45 "Geist Mono", monospace; color: #4a4853; margin-top: 3px; }
  .title { position: absolute; left: 56px; top: 48px; color: var(--paper); }
  .title h1 { font-size: 46px; letter-spacing: -0.04em; font-weight: 600; }
  .title p { font: 400 14px/1.6 "Geist Mono", monospace; opacity: .8; margin-top: 8px; max-width: 520px; }
  .legend { position: absolute; left: 56px; bottom: 48px; display: grid; gap: 9px; font: 400 13px "Geist Mono", monospace; color: var(--paper); }
  .legend i { display: inline-block; width: 26px; height: 12px; border-radius: 3px; margin-right: 10px; vertical-align: -1px; }
  .lamp { position: absolute; transform: translate(-50%, 0); top: 22px; color: var(--paper); font: 400 13px "Geist Mono", monospace; text-align: center; }
  .lamp::before { content: ""; display: block; margin: 0 auto 8px; width: 14px; height: 14px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 18px 4px rgba(242,182,90,.8); }
</style>
</head>
<body>
  <div class="world" role="img" aria-label="The whole sheet from above: the field of questions, the lamp's fired circle, the class and the lamp's foot"></div>
  <svg id="route" viewBox="0 0 1920 1200" aria-hidden="true"></svg>
  <div class="title"><h1>Pliego: un solo mundo</h1>
    <p>Una hoja de 2,0 × 1,4 m bajo una lámpara. Todo está cortado y plegado de ella. El recorrido dibuja una S desde el margen hasta la luz.</p></div>
  <div class="legend">
    <span><i style="background:#ede6d8"></i>papel: todavía no</span>
    <span><i style="background:#6b4423"></i>borde tostado: cambiando</span>
    <span><i style="background:linear-gradient(90deg,#f1ebdf,#cfd9cf)"></i>porcelana: construido</span>
    <span><i style="background:#9a3b2a;height:3px;vertical-align:4px"></i>hilo rojo: preguntas relacionadas</span>
    <span><i style="background:none;border-top:2px dashed #f2b65a;height:0;vertical-align:4px"></i>recorrido principal</span>
  </div>
  <div id="labels"></div>
<script>
  // Projected through the map camera by pliego.py --project 1 (x, y in 0..1 of the image).
  const P = {"margen":[0.3704,0.9429],"campo":[0.3692,0.5208],"pliegue":[0.4692,0.7408],"circulo":[0.5797,0.4234],"aula":[0.5928,0.2342],"pie":[0.7653,0.4265],"lamp":[0.5816,-0.1662],"scope":[0.3979,0.9138],"route0":[0.376,0.9119],"route1":[0.4304,0.7547],"route2":[0.4993,0.613],"route3":[0.5728,0.4792],"route4":[0.6053,0.3176],"route5":[0.7427,0.4037]}
  const W = 1920, H = 1200, px = (k) => [P[k][0] * W, P[k][1] * H]
  const route = ["route0", "route1", "route2", "route3", "route4", "route5"].map(px)
  const d = "M" + route.map((p) => p.join(" ")).join(" L")
  document.getElementById("route").innerHTML =
    `<path d="${d}" fill="none" stroke="#f2b65a" stroke-width="3" stroke-dasharray="10 9" stroke-linejoin="round" opacity=".95"/>` +
    route.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6" fill="#f2b65a"/>`).join("")
  const places = [
    ["margen", "1", "El margen", "entrada · quién soy · el recorte de Scope"],
    ["campo", "2", "Campo de preguntas", "cuaderno · 6 preguntas reales a lápiz"],
    ["pliegue", "3", "El pliegue largo", "el camino · navegación"],
    ["circulo", "4", "Círculo de la lámpara", "proyectos · porcelana cocida"],
    ["aula", "5", "El aula", "docencia · piezas plegadas por otros"],
    ["pie", "6", "Pie de la lámpara", "contacto · la nota y el lápiz"],
  ]
  const nudge = { margen: [-150, 40], campo: [-170, -10], pliegue: [170, 60], circulo: [-40, -40], aula: [120, -20], pie: [170, 40] }
  document.getElementById("labels").innerHTML = places.map(([k, n, t, s]) => {
    const [x, y] = px(k), [dx, dy] = nudge[k]
    return `<svg style="position:absolute;inset:0;pointer-events:none" viewBox="0 0 1920 1200"><line x1="${x}" y1="${y}" x2="${x + dx}" y2="${y + dy}" stroke="#ede6d8" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="4" fill="#ede6d8"/></svg>` +
      `<div class="label" style="left:${x + dx}px;top:${y + dy}px"><div class="card"><b><em>${n}</em>${t}</b><span>${s}</span></div></div>`
  }).join("")
  const lamp = document.createElement("div")
  lamp.className = "lamp"; lamp.style.left = px("lamp")[0] + "px"
  lamp.innerHTML = "boca de la lámpara<br>(1,25 m sobre el círculo, fuera de cuadro)"
  document.body.append(lamp)
</script>
</body>
</html>
