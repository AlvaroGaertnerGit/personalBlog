<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pliego · home (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
  /* Mobile is its own camera (vertical render), not a crop: Scope lower, the field
     and the sky above it, so the type lives in the sky and the thumb reaches the route. */
  :root { --ink: #1c1b21; --paper: #ede6d8; --ivory: #f4efe6; --amber: #f2b65a; --margin: #c06a55; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; background: #0b1220; }
  body { font-family: Geist, system-ui, sans-serif; color: var(--ivory); -webkit-font-smoothing: antialiased; }
  .world { position: absolute; inset: 0; background: url(../renders/home-m.jpg) 50% 100% / cover no-repeat; }
  .wash { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,38,56,.72) 0%, rgba(40,38,56,.25) 34%, transparent 46%); }
  header { position: absolute; inset: 0 0 auto; height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; }
  .mark { display: flex; gap: 10px; align-items: center; }
  .mark i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px 2px rgba(242,182,90,.7); }
  .menu { font: 500 12px "Geist Mono", monospace; border: 1px solid rgba(244,239,230,.6); padding: 9px 14px; border-radius: 999px; }
  .copy { position: absolute; left: 20px; right: 20px; top: 92px; }
  .kicker { font: 500 11px/1.5 "Geist Mono", monospace; letter-spacing: .02em; opacity: .85; }
  h1 { font-weight: 600; font-size: 58px; line-height: .9; letter-spacing: -0.05em; margin-top: 14px; }
  .lede { font-size: 18px; line-height: 1.32; margin-top: 16px; max-width: 320px; }
  .lede em { font-family: Newsreader, serif; font-style: italic; font-size: 19px; }
  .dock { position: absolute; left: 12px; right: 12px; bottom: 14px; background: rgba(237,230,216,.9); backdrop-filter: blur(8px); color: var(--ink);
    border-radius: 22px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
  .dock .walk { background: var(--ink); color: var(--paper); font-weight: 500; font-size: 14px; padding: 12px 16px; border-radius: 999px; }
  .dots { display: flex; gap: 9px; align-items: center; font: 400 11px "Geist Mono", monospace; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink); opacity: .55; }
  .dots i.on { background: var(--amber); border-color: var(--amber); opacity: 1; box-shadow: 0 0 8px rgba(242,182,90,.9); }
</style>
</head>
<body>
  <div class="world" role="img" aria-label="Scope at the margin of the sheet at dawn"></div>
  <div class="wash"></div>
  <header><span class="mark"><i aria-hidden="true"></i>Álvaro Gaertner</span><span class="menu">Places</span></header>
  <section class="copy">
    <p class="kicker">Software Development teacher<br>Gredos San Diego Guadarrama, Spain</p>
    <h1>Álvaro<br>Gaertner</h1>
    <p class="lede">I teach how to build with AI. <em>Then I go build it myself.</em></p>
  </section>
  <div class="dock">
    <span class="dots" aria-label="Margin, 1 of 5"><i class="on"></i><i></i><i></i><i></i><i></i>&nbsp;Margin</span>
    <span class="walk">Walk in ↓</span>
  </div>
</body>
</html>
