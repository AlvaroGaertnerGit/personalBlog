<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pliego · first seconds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
  /* Animatic: Blender keyframes cross-faded on the real timing, with the real UI on top.
     The UI is there from frame 0 (server-rendered): the night is the loading state of the
     same page, not a screen in front of it. ?frame=N freezes a beat (for captures). */
  :root { --ink: #1c1b21; --soft: #4a4853; --paper: #ede6d8; --ivory: #f4efe6; --amber: #f2b65a; --margin: #9a3b2a; --fg: var(--ink); --fg-soft: var(--soft); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1220; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .shot { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity .7s ease; }
  .shot.on { opacity: 1; }
  body.night { --fg: var(--ivory); --fg-soft: rgba(244,239,230,.75); }
  .ui { position: absolute; inset: 0; color: var(--fg); transition: color .7s ease; }
  .wash { position: absolute; inset: 0; transition: opacity .7s ease;
    background: linear-gradient(90deg, rgba(237,230,216,.55) 0%, rgba(237,230,216,.2) 34%, transparent 52%), linear-gradient(0deg, rgba(237,230,216,.45) 0%, transparent 30%); }
  body.night .wash { opacity: 0; }
  header { position: absolute; inset: 0 0 auto; height: 88px; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; }
  .mark { font-weight: 600; font-size: 17px; display: flex; gap: 12px; align-items: center; }
  .mark i { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px 2px rgba(242,182,90,.7); }
  nav { display: flex; gap: 34px; font-size: 15px; font-weight: 500; }
  .copy { position: absolute; left: 64px; bottom: 150px; width: 1000px; transition: opacity .5s ease, transform .5s ease; }
  .kicker { font: 500 14px "Geist Mono", monospace; color: var(--fg-soft); }
  h1 { font-weight: 600; font-size: 132px; line-height: .9; letter-spacing: -0.052em; margin-top: 22px; }
  .lede { font-size: 30px; line-height: 1.28; margin-top: 28px; }
  .walk { position: absolute; left: 64px; bottom: 64px; display: inline-flex; gap: 12px; align-items: center; background: var(--fg); color: #1c1b21; padding: 15px 24px; border-radius: 999px; font-weight: 500; }
  body:not(.night) .walk { color: var(--paper); }
  .walk.invite { box-shadow: 0 0 0 0 rgba(242,182,90,.7); animation: invite 1.6s ease-out 1; }
  @keyframes invite { from { box-shadow: 0 0 0 0 rgba(242,182,90,.8); } to { box-shadow: 0 0 0 18px rgba(242,182,90,0); } }
  .notebook { position: absolute; left: 64px; top: 128px; opacity: 0; transition: opacity .6s ease .3s; color: var(--ink);
    background: rgba(237,230,216,.9); backdrop-filter: blur(6px); padding: 22px 30px 26px; border-radius: 6px; box-shadow: 0 20px 50px -20px rgba(11,18,32,.4); }
  .notebook small { font: italic 400 22px Newsreader, serif; color: var(--soft); }
  .notebook h2 { font-size: 80px; letter-spacing: -0.05em; font-weight: 600; line-height: .95; margin-top: 10px; }
  body.walked .copy { opacity: 0; transform: translateY(-20px); }
  body.walked .notebook { opacity: 1; }
  .route { position: absolute; right: 64px; bottom: 64px; display: flex; align-items: center; font: 400 12px "Geist Mono", monospace; color: var(--soft);
    background: rgba(237,230,216,.72); padding: 14px 20px; border-radius: 999px; }
  .route span { display: flex; align-items: center; gap: 10px; }
  .route span + span::before { content: ""; width: 40px; height: 1px; background: currentColor; opacity: .5; margin: 0 12px; }
  .route i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
  .route .on { color: var(--ink); } .route .on i { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 10px rgba(242,182,90,.9); }
  .clock { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); font: 500 13px "Geist Mono", monospace; color: #1c1b21; background: var(--amber);
    padding: 6px 12px; border-radius: 99px; }
  .clock span { opacity: .7; margin-left: 10px; font-weight: 400; }
</style>
</head>
<body class="night">
  <div class="shot on" style="background-image:url(../renders/d2-lampon.jpg)"></div>
  <div class="shot" style="background-image:url(../renders/d3-home.jpg)"></div>
  <div class="shot" style="background-image:url(../renders/d4-invite.jpg)"></div>
  <div class="shot" style="background-image:url(../renders/a2-inside.jpg)"></div>
  <div class="ui">
    <div class="wash"></div>
    <header><div class="mark"><i aria-hidden="true"></i>Álvaro Gaertner</div>
      <nav aria-label="Primary"><span>Work</span><span>Notebook</span><span>Teaching</span><span>About</span><span>Contact</span></nav></header>
    <section class="copy">
      <p class="kicker">Software Development teacher · Gredos San Diego Guadarrama, Spain</p>
      <h1>Álvaro Gaertner</h1>
      <p class="lede">I teach how to build with AI. Then I go build it myself.</p>
    </section>
    <section class="notebook" aria-hidden="true"><small>You weren't supposed to see this.</small><h2>Open notebook.</h2></section>
    <span class="walk" id="walk">Walk in ↓</span>
    <div class="route" id="route"><span class="on"><i></i>Margin</span><span><i></i>Questions</span><span><i></i>The light</span><span><i></i>Class</span><span><i></i>Lamp</span></div>
  </div>
  <div class="clock" id="clock"></div>
<script>
  // [shot, ms on screen, body classes, label]
  const BEATS = [
    [0, 900, "night", "0.0 s · the page is already here; the world is still night (loading)"],
    [1, 2300, "", "0.9 s · the lamp comes on; Scope looks up from the margin, at you"],
    [2, 4000, "invite", "3.2 s · the unwritten sheet lifts a little; Scope glances at it"],
    [3, 3500, "walked", "on scroll · the camera follows the long fold into the questions"],
  ]
  const shots = [...document.querySelectorAll(".shot")]
  const clock = document.getElementById("clock")
  function show(i) {
    const [shot, , cls, label] = BEATS[i]
    shots.forEach((s, k) => s.classList.toggle("on", k === shot))
    document.body.className = cls
    clock.innerHTML = label.replace(" · ", "<span>") + "</span>"
    const walk = document.getElementById("walk")
    walk.classList.remove("invite"); if (cls === "invite") { void walk.offsetWidth; walk.classList.add("invite") }
    const r = document.getElementById("route").children
    ;[...r].forEach((el, k) => el.classList.toggle("on", k === (cls === "walked" ? 1 : 0)))
  }
  const fixed = new URLSearchParams(location.search).get("frame")
  if (fixed !== null) { show(+fixed); document.querySelectorAll(".shot,.ui,.wash,.copy,.notebook").forEach((e) => e.style.transition = "none") }
  else { let i = 0; const loop = () => { show(i); setTimeout(loop, BEATS[i][1]); i = (i + 1) % BEATS.length }; loop() }
</script>
</body>
</html>
